<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070a14" />
<meta name="mobile-web-app-capable" content="yes" />
<title>CAPITÃO BALA</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/style.css?v=202610191545" />
<script type="importmap">
{ "imports": { "three": "./js/vendor/three.module.js", "three/addons/": "./js/vendor/addons/" } }
</script>
</head>
<body>
<canvas id="cena" aria-label="Arena do jogo"></canvas>

<!-- HUD -->
<div id="hud" hidden>
  <div class="hud-top">
    <div class="hp-wrap"><div class="hp-label">VIDA</div><div class="hp-bar"><div id="hp-fill"></div><div id="hp-ghost"></div></div></div>
    <div class="hud-mid"><div id="hud-score">0</div><div id="hud-wave">ONDA 1</div></div>
    <button id="btn-pause" class="icon-btn" aria-label="Pausar">❚❚</button>
  </div>
  <div id="hud-power"></div>
  <div id="hud-combo" hidden></div>
  <div id="boss-wrap" hidden><div id="boss-name">CHEFE</div><div class="boss-bar"><div id="boss-fill"></div></div></div>
  <div id="banner" hidden></div>
  <div id="dmg-layer"></div>
  <div id="joy-base" hidden><div id="joy-knob"></div></div>
  <div id="aim-base" hidden><div id="aim-knob"></div></div>
  <button id="btn-dash" class="big-btn touch-only" aria-label="Esquiva">💨<span>ESQUIVA</span></button>
  <div id="hurt-vignette"></div>
  <div id="low-vignette"></div>
</div>

<!-- Título -->
<section id="tela-titulo" class="screen">
  <div class="logo">
    <div class="logo-sub">ARCADE 3D</div>
    <h1><span class="l1">CAPITÃO</span><span class="l2">BALA</span></h1>
    <div class="logo-tag">Zumbis e robôs invasores. Só um herói segura a arena.</div>
  </div>
  <div class="menu">
    <button id="btn-jogar" class="btn btn-primary">▶ JOGAR</button>
    <button id="btn-como" class="btn btn-ghost">Como jogar</button>
    <div class="menu-row">
      <button id="btn-config" class="btn btn-ghost small">⚙ Configurações</button>
      <button id="btn-som" class="btn btn-ghost small">🔊 Som: ligado</button>
    </div>
  </div>
  <div class="recorde">Recorde: <b id="titulo-recorde">0</b></div>
</section>

<section id="tela-tutorial" class="screen panel-screen" hidden>
  <div class="panel tut">
    <button id="tut-pular" class="tut-skip" aria-label="Pular tutorial">Pular ✕</button>
    <div id="tut-art" class="tut-art" aria-hidden="true"><div class="ph"><i class="z1"></i><i class="z2"></i><i class="hero"></i><i class="joy"></i><i class="thumb"></i><i class="dashb">💨</i><i class="key">W A S D</i><i class="item i1"></i><i class="item i2"></i><i class="item i3"></i></div></div>
    <h2 id="tut-titulo">Como jogar</h2>
    <p id="tut-txt" class="tut-txt"></p>
    <div id="tut-dots" class="tut-dots"></div>
    <button id="tut-prox" class="btn btn-primary">Próximo ▶</button>
  </div>
</section>

<section id="tela-config" class="screen panel-screen" hidden>
  <div class="panel">
    <h2>Configurações</h2>
    <div class="cfg-row"><span>Qualidade gráfica</span>
      <div class="seg seg4" id="seg-qual"><button data-q="auto">Auto</button><button data-q="0">Baixa</button><button data-q="1">Média</button><button data-q="2">Alta</button></div>
    </div>
    <div id="cfg-info" class="cfg-info"></div>
    <div class="cfg-row"><span>Vibração</span>
      <div class="seg" id="seg-vib"><button data-v="1">Ligada</button><button data-v="0">Desligada</button></div>
    </div>
    <div class="cfg-row"><span>Som</span>
      <div class="seg" id="seg-som"><button data-s="1">Ligado</button><button data-s="0">Desligado</button></div>
    </div>
    <button id="btn-config-ok" class="btn btn-primary">Voltar</button>
  </div>
</section>

<section id="tela-pausa" class="screen panel-screen" hidden>
  <div class="panel">
    <h2>Pausado</h2>
    <button id="btn-continuar" class="btn btn-primary">▶ Continuar</button>
    <button id="btn-reiniciar" class="btn btn-ghost">↻ Reiniciar</button>
    <button id="btn-som2" class="btn btn-ghost small">🔊 Som: ligado</button>
    <button id="btn-config2" class="btn btn-ghost small">⚙ Configurações</button>
    <button id="btn-menu" class="btn btn-ghost small">Menu inicial</button>
  </div>
</section>

<section id="tela-fim" class="screen panel-screen" hidden>
  <div class="panel">
    <h2 id="fim-titulo">FIM DE JOGO</h2>
    <div id="fim-recorde" class="novo-recorde" hidden>★ NOVO RECORDE! ★</div>
    <div class="stats">
      <div><span>Pontos</span><b id="fim-pontos">0</b></div>
      <div><span>Onda</span><b id="fim-onda">1</b></div>
      <div><span>Abates</span><b id="fim-abates">0</b></div>
      <div><span>Chefes</span><b id="fim-chefes">0</b></div>
      <div><span>Maior combo</span><b id="fim-combo">0</b></div>
      <div><span>Recorde</span><b id="fim-melhor">0</b></div>
    </div>
    <button id="btn-denovo" class="btn btn-primary">↻ Jogar de novo</button>
    <button id="btn-fim-menu" class="btn btn-ghost small">Menu inicial</button>
  </div>
</section>

<div id="loading">Carregando arena…</div>
<div id="erro" hidden></div>
<script type="module" src="js/main.js?v=202610191545"></script>
</body>
</html>
